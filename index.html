<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ADsP 기출문제 풀이</title>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
        }

        :root {
            color-scheme: light;
            --bg: #f5f6f7;
            --surface: #ffffff;
            --surface-sunken: #f0f2f5;
            --border: #f0f2f5;
            --border-strong: #9fa4b0;
            --text: #111111;
            --text-muted: #555c68;
            --text-disabled: #9fa4b0;
            --ink: #000000;
            --mint: #13bd7e;
            --mint-hover: #058759;
            --mint-deep: #06a96c;
            --mint-tint: rgba(19, 189, 126, 0.15);
            --danger: #dc2626;
            --danger-bg: #fdecec;
            --warning-bg: #fff9db;
            --warning-text: #8a5a00;
            --radius-lg: 12px;
            --radius: 8px;
            --radius-pill: 9999px;
            --ease: cubic-bezier(0.16, 1, 0.3, 1);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: -0.32px;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
        }

        button {
            font-family: inherit;
            color: var(--text);
            -webkit-appearance: none;
            appearance: none;
        }

        button:disabled {
            opacity: 1;
            -webkit-text-fill-color: currentColor;
        }

        a {
            color: var(--text);
        }

        h1,
        h2,
        h3 {
            font-family: inherit;
            margin: 0;
        }

        p {
            margin: 0;
        }

        button:focus-visible,
        a:focus-visible,
        textarea:focus-visible {
            outline: 2.5px solid var(--mint-deep);
            outline-offset: 2px;
            border-radius: 4px;
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 16px;
        }

        .app-header {
            position: sticky;
            top: 0;
            background: var(--mint-deep);
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            z-index: 10;
        }

        .header-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            max-width: 720px;
            margin: 0 auto;
        }

        .header-row h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.4px;
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #fff;
        }

        .header-row h1.header-page {
            font-size: 13px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.85);
        }

        .btn-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            flex: 0 0 auto;
            white-space: nowrap;
            background: none;
            border: none;
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 8px;
            margin: -6px -8px;
            border-radius: 6px;
            transition: background-color 160ms var(--ease);
        }

        .header-row .btn-link#homeBtn {
            font-size: 18px;
        }

        @media (hover:hover) and (pointer:fine) {
            .btn-link:hover {
                background: rgba(255, 255, 255, 0.15);
            }
        }

        .btn-link:focus-visible {
            outline-color: #fff;
        }

        .lead {
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.6;
            margin: 16px 0;
        }

        .mode-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 20px 0;
        }

        .mode-card {
            display: block;
            text-align: left;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 18px 20px;
            cursor: pointer;
            width: 100%;
            transition: border-color 160ms var(--ease), background-color 160ms var(--ease);
        }

        @media (hover:hover) and (pointer:fine) {
            .mode-card:hover {
                border-color: var(--mint-deep);
                background: var(--mint-tint);
            }
        }

        .mode-card h2 {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin: 0 0 4px;
        }

        .mode-card p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.55;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            min-height: 50px;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.32px;
            border-radius: var(--radius);
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: background-color 160ms var(--ease), border-color 160ms var(--ease), color 160ms var(--ease);
        }

        .btn.full {
            width: 100%;
            margin-bottom: 10px;
        }

        .btn.small {
            min-height: 38px;
            padding: 6px 14px;
            font-size: 13px;
        }

        .reset-btn {
            margin: 4px 0 16px;
        }

        .btn-primary {
            background: var(--mint-deep);
            color: #fff;
        }

        @media (hover:hover) and (pointer:fine) {
            .btn-primary:hover:not(:disabled) {
                background: var(--mint-hover);
            }
        }

        .btn-primary:disabled {
            background: var(--surface-sunken);
            color: var(--text-disabled);
            cursor: not-allowed;
        }

        .btn-outline {
            background: var(--surface);
            color: var(--text);
            border-color: var(--border-strong);
        }

        @media (hover:hover) and (pointer:fine) {
            .btn-outline:hover {
                background: var(--bg);
            }
        }

        .btn-outline:disabled {
            color: var(--text-disabled);
            border-color: var(--border);
            cursor: not-allowed;
        }

        .btn-success {
            background: var(--mint-tint);
            color: var(--mint-deep);
            border-color: var(--mint-tint);
        }

        .btn-success.active {
            background: var(--mint-deep);
            color: #fff;
            border-color: var(--mint-deep);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger);
            border-color: var(--danger-bg);
        }

        .btn-danger.active {
            background: var(--danger);
            color: #fff;
            border-color: var(--danger);
        }

        .btn-danger-outline {
            background: var(--surface);
            color: var(--danger);
            border-color: var(--border);
        }

        @media (hover:hover) and (pointer:fine) {
            .btn-danger-outline:hover {
                background: var(--danger-bg);
                border-color: var(--danger-bg);
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 20px;
            margin-bottom: 16px;
        }

        .q-source {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .q-type {
            background: var(--mint-tint);
            color: var(--mint-deep);
            padding: 3px 10px;
            border-radius: var(--radius-pill);
            font-size: 12px;
            font-weight: 700;
        }

        .q-text {
            font-size: 17px;
            line-height: 1.75;
            margin-bottom: 18px;
            white-space: pre-wrap;
        }

        .q-reference {
            margin-bottom: 18px;
            padding: 12px 14px;
            background: var(--surface-sunken);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            line-height: 1.65;
            color: var(--text-muted);
        }

        .q-reference p {
            margin: 0 0 8px;
            white-space: pre-wrap;
        }

        .q-reference p:last-child {
            margin-bottom: 0;
        }

        .q-reference .ref-code {
            margin: 0 0 8px;
            padding: 10px 12px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow-x: auto;
            font-size: 13px;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .q-reference .ref-table-wrap {
            margin: 0 0 8px;
            overflow-x: auto;
        }

        .q-reference .ref-table {
            border-collapse: collapse;
            width: 100%;
            font-size: 13px;
        }

        .q-reference .ref-table th,
        .q-reference .ref-table td {
            border: 1px solid var(--border);
            padding: 6px 10px;
            text-align: center;
            white-space: nowrap;
        }

        .q-reference .ref-table th {
            background: var(--surface);
            font-weight: 700;
        }

        .q-reference .ref-list {
            margin: 0 0 8px;
            padding-left: 20px;
        }

        .q-reference .ref-list:last-child {
            margin-bottom: 0;
        }

        .choices {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .choice-btn {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
            text-align: left;
            background: var(--surface);
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 16px;
            font-size: 16px;
            line-height: 1.6;
            letter-spacing: -0.32px;
            cursor: pointer;
            transition: border-color 160ms var(--ease), background-color 160ms var(--ease);
        }

        @media (hover:hover) and (pointer:fine) {
            .choice-btn:hover:not(:disabled) {
                border-color: var(--border-strong);
            }
        }

        .choice-num {
            flex: 0 0 auto;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--surface-sunken);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            transition: background-color 160ms var(--ease), color 160ms var(--ease);
        }

        .choice-num-col {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .guess-tag {
            font-size: 10px;
            font-weight: 700;
            line-height: 1;
            padding: 3px 6px;
            border-radius: var(--radius-pill);
            background: var(--surface-sunken);
            color: var(--text-muted);
            border: 1px solid var(--border);
            cursor: pointer;
            white-space: nowrap;
        }

        @media (hover:hover) and (pointer:fine) {
            .guess-tag:hover {
                border-color: var(--border-strong);
            }
        }

        .guess-tag.active {
            background: var(--warning-bg);
            color: var(--warning-text);
            border-color: var(--warning-bg);
        }

        .choice-text {
            flex: 1;
            word-break: break-word;
            padding-top: 1px;
        }

        .choice-tag {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap;
        }

        .choice-btn.selected {
            border-color: var(--mint-deep);
            background: var(--mint-tint);
        }

        .choice-btn.selected .choice-num {
            background: var(--mint-deep);
            color: #fff;
        }

        .choice-btn.correct {
            border-color: var(--mint-deep);
            background: var(--mint-tint);
        }

        .choice-btn.correct .choice-tag {
            color: var(--mint-deep);
        }

        .choice-btn.incorrect {
            border-color: var(--danger);
            background: var(--danger-bg);
        }

        .choice-btn.incorrect .choice-tag {
            color: var(--danger);
        }

        .choice-btn:disabled {
            cursor: default;
        }

        .text-answer {
            width: 100%;
            min-height: 96px;
            padding: 12px 14px;
            font-size: 16px;
            line-height: 1.6;
            color: var(--text);
            border: 1.5px solid var(--border-strong);
            border-radius: var(--radius);
            font-family: inherit;
            resize: vertical;
            transition: border-color 160ms var(--ease);
            -webkit-appearance: none;
            appearance: none;
        }

        .text-answer:focus {
            border-color: var(--mint-deep);
            outline: none;
        }

        .explanation-block {
            margin-top: 16px;
            padding: 14px 16px;
            background: var(--surface-sunken);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            font-size: 15px;
            line-height: 1.75;
            white-space: pre-wrap;
        }

        .explanation-answer {
            font-weight: 700;
            letter-spacing: -0.32px;
            margin-bottom: 6px;
            color: var(--mint-deep);
        }

        .self-grade {
            margin-top: 14px;
        }

        .self-grade p {
            margin: 0 0 8px;
            font-size: 14px;
            color: var(--text-muted);
        }

        .self-grade-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .stat-bar {
            display: flex;
            gap: 10px;
            margin: 16px 0 10px;
        }

        .stat-item {
            flex: 1;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 12px;
            text-align: center;
        }

        .stat-item.clickable {
            cursor: pointer;
            border: 1.5px solid var(--border-strong);
        }

        @media (hover:hover) and (pointer:fine) {
            .stat-item.clickable:hover {
                border-color: var(--mint-deep);
            }
        }

        .stat-num {
            display: block;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-muted);
        }

        .action-row {
            margin: 16px 0;
        }

        .action-row.two-col {
            display: flex;
            gap: 10px;
        }

        @media (max-width:600px) {
            .exam-container {
                padding-bottom: 92px;
            }

            .exam-container .action-row.two-col {
                position: fixed;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 20;
                margin: 0;
                padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
                background: var(--surface);
                border-top: 1px solid var(--border);
            }
        }

        .action-row.two-col .btn {
            flex: 1;
            margin-bottom: 0;
        }

        .progress-line {
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .qnav-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(42px, 1fr));
            gap: 6px;
            margin: 16px 0;
        }

        .qnav-btn {
            aspect-ratio: 1;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text);
            transition: border-color 160ms var(--ease), background-color 160ms var(--ease);
        }

        .qnav-btn.answered {
            background: var(--mint-tint);
            border-color: var(--mint-deep);
            color: var(--mint-deep);
        }

        .qnav-btn.current {
            border-color: var(--ink);
            border-width: 2.5px;
        }

        .round-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin: 20px 0;
        }

        .round-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 160ms var(--ease);
        }

        @media (hover:hover) and (pointer:fine) {
            .round-card:hover {
                border-color: var(--border-strong);
            }
        }

        .round-num {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.4px;
        }

        .round-status {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .round-card.status-pass .round-status {
            color: var(--mint-deep);
            font-weight: 700;
        }

        .round-card.status-fail .round-status {
            color: var(--danger);
            font-weight: 700;
        }

        .round-card.status-progress .round-status {
            color: var(--warning-text);
            font-weight: 700;
        }

        @media (min-width:480px) {
            .round-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .round-toggle-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 4px;
        }

        .round-toggle-header span {
            font-size: 14px;
            font-weight: 700;
            color: var(--text-muted);
        }

        .round-toggle-header .btn-link {
            color: var(--mint-deep);
            font-size: 13px;
            padding: 4px 6px;
            margin: -4px -6px;
        }

        @media (hover:hover) and (pointer:fine) {
            .round-toggle-header .btn-link:hover {
                background: var(--mint-tint);
            }
        }

        .round-card.selected {
            border-color: var(--mint-deep);
            background: var(--mint-tint);
        }

        .round-card.selected .round-status {
            color: var(--mint-deep);
            font-weight: 700;
        }

        .result-banner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 22px;
            border-radius: var(--radius-lg);
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.4px;
            margin: 16px 0;
        }

        .result-banner.pass {
            background: var(--mint-deep);
            color: #fff;
        }

        .result-banner.fail {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .score-summary {
            font-size: 16px;
            margin-bottom: 14px;
            text-align: center;
            font-weight: 700;
        }

        .solve-time-line {
            font-size: 13px;
            margin: -8px 0 14px;
            text-align: center;
            color: var(--text-muted);
        }

        .notice {
            background: var(--warning-bg);
            color: var(--warning-text);
            padding: 12px 14px;
            border-radius: var(--radius);
            font-size: 14px;
            margin-bottom: 14px;
            line-height: 1.6;
        }

        .table-wrap {
            overflow-x: auto;
            margin-bottom: 16px;
        }

        .subject-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            min-width: 420px;
        }

        .subject-table th {
            color: var(--text-muted);
            font-weight: 700;
            font-size: 12px;
        }

        .subject-table th,
        .subject-table td {
            padding: 10px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }

        .subject-table .fail-row td {
            color: var(--danger);
            font-weight: 700;
        }

        .filter-tabs {
            display: flex;
            gap: 6px;
            margin: 18px 0 10px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 4px;
            border-radius: var(--radius);
        }

        .tab-btn {
            flex: 1;
            padding: 9px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 14px;
            font-weight: 700;
            transition: background-color 160ms var(--ease), color 160ms var(--ease);
        }

        .tab-btn.active {
            background: var(--mint-deep);
            color: #fff;
        }

        .tab-btn.active:focus-visible {
            outline-color: #fff;
        }

        .ox {
            display: inline-flex;
            align-items: center;
            gap: 3px;
            font-weight: 700;
            font-size: 12px;
            padding: 3px 10px;
            border-radius: var(--radius-pill);
        }

        .ox-correct {
            background: var(--mint-tint);
            color: var(--mint-deep);
        }

        .ox-wrong {
            background: var(--danger-bg);
            color: var(--danger);
        }

        .ox-guess {
            background: var(--warning-bg);
            color: var(--warning-text);
        }

        .review-answers {
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 22, 30, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
        }

        .modal-box {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 22px;
            max-width: 360px;
            width: 100%;
        }

        .modal-box p {
            margin: 0 0 18px;
            font-size: 15px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        .modal-actions .btn {
            margin-bottom: 0;
        }

        .icon {
            display: inline-block;
            vertical-align: -2px;
            flex-shrink: 0;
        }

        .skeleton-list {
            margin: 20px 0;
        }

        .skeleton-block {
            background: linear-gradient(90deg, var(--surface-sunken) 25%, var(--border) 37%, var(--surface-sunken) 63%);
            background-size: 400% 100%;
            border-radius: var(--radius-lg);
            animation: skeleton-pulse 1.4s ease-in-out infinite;
        }

        .skeleton-lead {
            height: 20px;
            width: 70%;
            margin-bottom: 24px;
        }

        .skeleton-card {
            height: 76px;
            margin-bottom: 10px;
        }

        @keyframes skeleton-pulse {
            0% {
                background-position: 100% 0;
            }

            100% {
                background-position: -100% 0;
            }
        }

        @media (prefers-reduced-motion:reduce) {
            .skeleton-block {
                animation: none;
            }
        }

        .error-card {
            text-align: center;
        }

        .error-card h2 {
            font-size: 17px;
            letter-spacing: -0.4px;
            margin-bottom: 8px;
        }

        .error-card .lead {
            margin: 0 0 18px;
        }

        footer.app-footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            padding: 24px 16px 40px;
        }
    </style>
</head>

<body>
    <div id="app"></div>
    <script>
        (function () {
            'use strict';

            var ICON_CHECK = '<svg class="icon" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.3l3.6 3.6L16 6.2"/></svg>';
            var ICON_X = '<svg class="icon" width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9"/></svg>';
            var ICON_CHEVRON_LEFT = '<svg class="icon" width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5L6.5 10l6 5.5"/></svg>';

            var SCHEMA_V = 1;
            var SUBJECT_NAMES = { 1: '데이터 이해', 2: '데이터의 분석 기획', 3: '데이터 분석' };
            var DATA_URL = 'exam.json';
            var ROUNDS = [];

            var KEY_INFINITE = 'adsp:infinite';
            var KEY_MOCK = 'adsp:mock';
            var KEY_WRONG = 'adsp:wrong';
            function KEY_ROUND(r) { return 'adsp:round:' + r; }
            function ALL_KEYS() {
                var ks = [KEY_INFINITE, KEY_MOCK, KEY_WRONG];
                ROUNDS.forEach(function (r) { ks.push(KEY_ROUND(r)); });
                return ks;
            }

            /* ---------- data load & preprocessing ---------- */
            var allQuestions = [];
            var questionById = {};
            var poolQuestions = [];
            var questionsByRound = {};

            function initData(raw) {
                raw.rounds.forEach(function (r) {
                    r.subjects.forEach(function (s) {
                        s.questions.forEach(function (q) {
                            var excluded = (r.round === 14 && s.subject_no === 3 && q.number === 24);
                            var globalNumber = s.subject_no === 1 ? q.number : (s.subject_no === 2 ? q.number + 10 : q.number + 20);
                            allQuestions.push({
                                id: r.round + '_' + s.subject_no + '_' + q.number,
                                round: r.round,
                                subject_no: s.subject_no,
                                subject: s.subject,
                                number: q.number,
                                globalNumber: globalNumber,
                                question: q.question,
                                answer: Array.isArray(q.answer) ? q.answer : [q.answer],
                                explanation: q.explanation,
                                choices: q.choices || [],
                                type: q.type,
                                reference: q.reference,
                                excluded: excluded
                            });
                        });
                    });
                });
                allQuestions.forEach(function (q) { questionById[q.id] = q; });
                poolQuestions = allQuestions.filter(function (q) { return !q.excluded; });
                ROUNDS = raw.rounds.map(function (r) { return r.round; }).sort(function (a, b) { return a - b; });
                ROUNDS.forEach(function (rn) {
                    questionsByRound[rn] = allQuestions.filter(function (q) { return q.round === rn && !q.excluded; })
                        .sort(function (a, b) { return a.globalNumber - b.globalNumber; });
                });
            }

            function loadQuizData() {
                state = { screen: 'loading' };
                render();
                Promise.all([
                    fetch(DATA_URL, { cache: 'no-cache' }).then(function (res) {
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        return res.json();
                    }),
                    idbPreload()
                ]).then(function (results) {
                    initData(results[0]);
                    nav('home');
                }).catch(function (err) {
                    state = { screen: 'error' };
                    render();
                });
            }

            /* ---------- storage helpers (IndexedDB) ---------- */
            var IDB_NAME = 'adsp-store';
            var IDB_STORE = 'kv';
            var idbCache = {};
            var idbDb = null;

            function openIdb() {
                return new Promise(function (resolve, reject) {
                    var req = indexedDB.open(IDB_NAME, 1);
                    req.onupgradeneeded = function () { req.result.createObjectStore(IDB_STORE); };
                    req.onsuccess = function () { resolve(req.result); };
                    req.onerror = function () { reject(req.error); };
                });
            }
            function idbPut(key, obj) {
                if (!idbDb) return;
                try { idbDb.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).put(obj, key); } catch (e) { /* ignore */ }
            }
            function idbDelete(key) {
                if (!idbDb) return;
                try { idbDb.transaction(IDB_STORE, 'readwrite').objectStore(IDB_STORE).delete(key); } catch (e) { /* ignore */ }
            }
            function migrateFromLocalStorage() {
                try {
                    var keys = [];
                    for (var i = 0; i < localStorage.length; i++) {
                        var k = localStorage.key(i);
                        if (k && k.indexOf('adsp:') === 0) keys.push(k);
                    }
                    keys.forEach(function (k) {
                        if (idbCache[k] === undefined) {
                            try {
                                var obj = JSON.parse(localStorage.getItem(k));
                                idbCache[k] = obj;
                                idbPut(k, obj);
                            } catch (e) { /* ignore */ }
                        }
                        localStorage.removeItem(k);
                    });
                } catch (e) { /* ignore */ }
            }
            function idbPreload() {
                return openIdb().then(function (db) {
                    idbDb = db;
                    return new Promise(function (resolve) {
                        var req = db.transaction(IDB_STORE, 'readonly').objectStore(IDB_STORE).openCursor();
                        req.onsuccess = function (e) {
                            var cursor = e.target.result;
                            if (cursor) { idbCache[cursor.key] = cursor.value; cursor.continue(); }
                            else resolve();
                        };
                        req.onerror = function () { resolve(); };
                    });
                }).then(migrateFromLocalStorage).catch(function () { /* IndexedDB 사용 불가 시 메모리 캐시로만 동작 */ });
            }
            function loadState(key, fallback) {
                var obj = idbCache[key];
                if (!obj || obj.v !== SCHEMA_V) return fallback;
                return obj;
            }
            function saveState(key, obj) {
                idbCache[key] = obj;
                idbPut(key, obj);
            }
            function removeState(key) {
                delete idbCache[key];
                idbDelete(key);
            }

            /* ---------- utils ---------- */
            function shuffle(arr) {
                var a = arr.slice();
                for (var i = a.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = a[i]; a[i] = a[j]; a[j] = t;
                }
                return a;
            }
            function esc(str) {
                var d = document.createElement('div');
                d.textContent = (str === null || str === undefined) ? '' : String(str);
                return d.innerHTML;
            }
            function fmt1(n) {
                return (Math.round(n * 10) / 10).toFixed(1);
            }
            function fmtDuration(ms) {
                var totalSec = Math.max(0, Math.floor(ms / 1000));
                var h = Math.floor(totalSec / 3600);
                var m = Math.floor((totalSec % 3600) / 60);
                var sec = totalSec % 60;
                var mm = (h > 0 && m < 10 ? '0' : '') + m;
                var ss = (sec < 10 ? '0' : '') + sec;
                return (h > 0 ? h + ':' : '') + mm + ':' + ss;
            }
            function renderRefMd(md) {
                if (!md) return '';
                var lines = String(md).split('\n');
                var html = '';
                var i = 0;
                while (i < lines.length) {
                    var line = lines[i];
                    if (/^```/.test(line)) {
                        i++;
                        var codeLines = [];
                        while (i < lines.length && !/^```/.test(lines[i])) { codeLines.push(lines[i]); i++; }
                        i++;
                        html += '<pre class="ref-code"><code>' + esc(codeLines.join('\n')) + '</code></pre>';
                        continue;
                    }
                    if (/^\|.*\|\s*$/.test(line) && i + 1 < lines.length && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
                        var headerCells = line.split('|').slice(1, -1).map(function (c) { return c.trim(); });
                        i += 2;
                        var rows = [];
                        while (i < lines.length && /^\|.*\|\s*$/.test(lines[i])) {
                            rows.push(lines[i].split('|').slice(1, -1).map(function (c) { return c.trim(); }));
                            i++;
                        }
                        html += '<div class="ref-table-wrap"><table class="ref-table"><thead><tr>' +
                            headerCells.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') +
                            '</tr></thead><tbody>' +
                            rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') +
                            '</tbody></table></div>';
                        continue;
                    }
                    if (/^-\s+/.test(line)) {
                        var items = [];
                        while (i < lines.length && /^-\s+/.test(lines[i])) { items.push(lines[i].replace(/^-\s+/, '')); i++; }
                        html += '<ul class="ref-list">' + items.map(function (it) { return '<li>' + esc(it) + '</li>'; }).join('') + '</ul>';
                        continue;
                    }
                    if (line.trim() === '') { i++; continue; }
                    var paraLines = [];
                    while (i < lines.length && lines[i].trim() !== '' && !/^```/.test(lines[i]) && !/^\|.*\|\s*$/.test(lines[i]) && !/^-\s+/.test(lines[i])) {
                        paraLines.push(lines[i]);
                        i++;
                    }
                    html += '<p>' + esc(paraLines.join('\n')).replace(/\n/g, '<br>') + '</p>';
                }
                return html;
            }
            function on(sel, evt, handler) {
                var els = app.querySelectorAll(sel);
                els.forEach(function (el) { el.addEventListener(evt, handler); });
            }

            /* ---------- modal ---------- */
            function confirmModal(message, onYes) {
                var overlay = document.createElement('div');
                overlay.className = 'modal-overlay';
                var box = document.createElement('div');
                box.className = 'modal-box';
                var p = document.createElement('p');
                p.textContent = message;
                var actions = document.createElement('div');
                actions.className = 'modal-actions';
                var cancelBtn = document.createElement('button');
                cancelBtn.className = 'btn btn-outline';
                cancelBtn.textContent = '취소';
                var okBtn = document.createElement('button');
                okBtn.className = 'btn btn-primary';
                okBtn.textContent = '확인';
                actions.appendChild(cancelBtn);
                actions.appendChild(okBtn);
                box.appendChild(p);
                box.appendChild(actions);
                overlay.appendChild(box);
                document.body.appendChild(overlay);
                function close() {
                    if (overlay.parentNode) document.body.removeChild(overlay);
                    document.removeEventListener('keydown', onKey);
                }
                function onKey(e) { if (e.key === 'Escape') close(); }
                document.addEventListener('keydown', onKey);
                cancelBtn.addEventListener('click', close);
                okBtn.addEventListener('click', function () { close(); onYes(); });
            }

            /* ---------- app state ---------- */
            var app = document.getElementById('app');
            var state = { screen: 'loading' };
            var navHistory = [];
            var examTimerHandle = null;

            function nav(screen, extra) {
                if (state.screen !== 'loading' && state.screen !== 'error' && state.screen !== screen) {
                    navHistory.push(state);
                }
                state = Object.assign({ screen: screen }, extra || {});
                render();
                window.scrollTo(0, 0);
            }

            function navBack() {
                if (navHistory.length === 0) { nav('home'); return; }
                state = navHistory.pop();
                render();
                window.scrollTo(0, 0);
            }

            function render() {
                if (examTimerHandle) { clearInterval(examTimerHandle); examTimerHandle = null; }
                if (state.screen === 'loading') renderLoading();
                else if (state.screen === 'error') renderError();
                else if (state.screen === 'home') renderHome();
                else if (state.screen === 'infiniteHub') renderInfiniteHub();
                else if (state.screen === 'infinite') renderInfinite();
                else if (state.screen === 'mockHub') renderMockHub();
                else if (state.screen === 'mockSolve') renderExamSolve('mock');
                else if (state.screen === 'mockResult') renderExamResult('mock');
                else if (state.screen === 'roundHub') renderRoundHub();
                else if (state.screen === 'roundSolve') renderExamSolve('round');
                else if (state.screen === 'roundResult') renderExamResult('round');
                else if (state.screen === 'wrongList') renderWrongList();
                else if (state.screen === 'wrongSolve') renderExamSolve('wrong');
                else if (state.screen === 'wrongResult') renderExamResult('wrong');
                else if (state.screen === 'infiniteList') renderInfiniteList();
                else if (state.screen === 'infiniteSummary') renderInfiniteSummary();
            }

            /* ================= LOADING / ERROR ================= */
            function renderLoading() {
                app.innerHTML =
                    headerHtml('ADsP 기출문제 풀이') +
                    '<main class="container">' +
                    '<div class="skeleton-list" aria-live="polite" aria-busy="true">' +
                    '<div class="skeleton-block skeleton-lead"></div>' +
                    '<div class="skeleton-block skeleton-card"></div>' +
                    '<div class="skeleton-block skeleton-card"></div>' +
                    '<div class="skeleton-block skeleton-card"></div>' +
                    '</div>' +
                    '</main>';
            }
            function renderError() {
                app.innerHTML =
                    headerHtml('ADsP 기출문제 풀이') +
                    '<main class="container">' +
                    '<div class="card error-card">' +
                    '<h2>문제 데이터를 불러오지 못했습니다</h2>' +
                    '<p class="lead">exam.json을 불러오는 중 문제가 발생했습니다. 네트워크 연결을 확인한 뒤 다시 시도해주세요.</p>' +
                    '<button type="button" class="btn btn-primary full" id="retryLoadBtn">다시 시도</button>' +
                    '</div>' +
                    '</main>';
                on('#retryLoadBtn', 'click', function () { loadQuizData(); });
            }

            function headerHtml(pageTitle) {
                if (pageTitle === 'ADsP 기출문제 풀이') {
                    return '<header class="app-header"><div class="header-row"><h1>ADsP 기출문제 풀이</h1></div></header>';
                }
                return '<header class="app-header"><div class="header-row">' +
                    '<button type="button" class="btn-link" id="backBtn">' + ICON_CHEVRON_LEFT + ' 이전</button>' +
                    '<button type="button" class="btn-link" id="homeBtn">ADsP 기출문제 풀이</button>' +
                    '<h1 class="header-page">' + esc(pageTitle) + '</h1>' +
                    '</div></header>';
            }

            /* ================= HOME ================= */
            function renderHome() {
                var roundRange = ROUNDS[0] + '~' + ROUNDS[ROUNDS.length - 1] + '회';
                var excludedCount = allQuestions.length - poolQuestions.length;
                app.innerHTML =
                    headerHtml('ADsP 기출문제 풀이') +
                    '<main class="container">' +
                    '<p class="lead">' + roundRange + ' ADsP 기출문제 ' + poolQuestions.length + '문항' + (excludedCount ? '(제외 ' + excludedCount + '문항)' : '') + '으로 학습하세요.</p>' +
                    '<div class="mode-list">' +
                    '<button type="button" class="mode-card" data-nav="infiniteHub">' +
                    '<h2>무한 문제 풀이</h2>' +
                    '<p>전체 문항에서 한 문제씩 랜덤 출제. 정답 확인 후 바로 다음 문제로 넘어갑니다.</p>' +
                    '</button>' +
                    '<button type="button" class="mode-card" data-nav="mockHub">' +
                    '<h2>모의고사</h2>' +
                    '<p>' + ROUNDS.length + '개 회차 전체에서 과목별로 무작위 추출한 50문항 실전 모의고사.</p>' +
                    '</button>' +
                    '<button type="button" class="mode-card" data-nav="roundHub">' +
                    '<h2>회차별 문제 풀이</h2>' +
                    '<p>' + roundRange + ' 중 하나를 선택해 해당 회차 문제를 그대로 풀어봅니다.</p>' +
                    '</button>' +
                    '<button type="button" class="mode-card" data-nav="wrongList">' +
                    '<h2>틀린 문제 모아보기</h2>' +
                    '<p>모의고사·회차별 풀이·무한 문제 풀이를 통틀어 현재 틀린 문제만 모아 다시 확인합니다.</p>' +
                    '</button>' +
                    '</div>' +
                    '<button type="button" class="btn btn-outline btn-danger-outline full" id="resetAllBtn">전체 기록 초기화</button>' +
                    '</main>';

                on('[data-nav]', 'click', function (e) { nav(e.currentTarget.getAttribute('data-nav')); });
                on('#resetAllBtn', 'click', function () {
                    confirmModal('모든 학습 기록(무한 풀이 통계, 모의고사, 회차별 진행 데이터)이 삭제됩니다. 계속할까요?', function () {
                        ALL_KEYS().forEach(function (k) { removeState(k); });
                        nav('home');
                    });
                });
            }

            /* ================= INFINITE MODE ================= */
            function sameRoundFilter(a, b) {
                if (a === 'all' || b === 'all') return a === b;
                if (a.length !== b.length) return false;
                var sa = a.slice().sort(function (x, y) { return x - y; });
                var sb = b.slice().sort(function (x, y) { return x - y; });
                return sa.every(function (v, i) { return v === sb[i]; });
            }
            function subjectPoolIds(subjectFilter, roundFilter) {
                var qs = subjectFilter === 'all' ? poolQuestions : poolQuestions.filter(function (q) { return q.subject_no === subjectFilter; });
                if (roundFilter && roundFilter !== 'all') {
                    qs = qs.filter(function (q) { return roundFilter.indexOf(q.round) !== -1; });
                }
                return qs.map(function (q) { return q.id; });
            }
            function defaultInfiniteState(subjectFilter, roundFilter) {
                subjectFilter = subjectFilter || 'all';
                roundFilter = roundFilter || 'all';
                return { v: SCHEMA_V, subjectFilter: subjectFilter, roundFilter: roundFilter, stats: { solved: 0, correct: 0 }, history: [], pool: shuffle(subjectPoolIds(subjectFilter, roundFilter)), current: null };
            }
            function getInfiniteState() {
                var s = loadState(KEY_INFINITE, null);
                if (!s) { s = defaultInfiniteState(); saveState(KEY_INFINITE, s); }
                if (!s.subjectFilter) s.subjectFilter = 'all';
                if (!s.roundFilter) s.roundFilter = 'all';
                if (!s.history) s.history = [];
                return s;
            }
            function drawNextInfinite(s) {
                if (s.pool.length === 0) {
                    s.pool = shuffle(subjectPoolIds(s.subjectFilter, s.roundFilter));
                }
                var id = s.pool.pop();
                var q = questionById[id];
                var choiceOrder = q.type === '객관식' ? shuffle(q.choices) : null;
                s.current = { id: id, choiceOrder: choiceOrder, selectedIndex: null, typed: '', revealed: false, selfGrade: null, graded: false };
            }

            /* ---------- INFINITE HUB ---------- */
            function renderInfiniteHub() {
                var saved = loadState(KEY_INFINITE, null);
                if (!state.infSubjectPick) state.infSubjectPick = saved ? saved.subjectFilter : 'all';
                if (!state.infRoundPick) state.infRoundPick = (saved && saved.roundFilter !== 'all') ? saved.roundFilter.slice() : ROUNDS.slice();
                var subjectPick = state.infSubjectPick;
                var roundPick = state.infRoundPick;
                var canStart = roundPick.length > 0;
                var newRoundFilter = roundPick.length === ROUNDS.length ? 'all' : roundPick.slice();
                var matchesSaved = !!saved && saved.subjectFilter === subjectPick && sameRoundFilter(saved.roundFilter, newRoundFilter);

                var subjectTabsHtml = '<div class="filter-tabs">' +
                    '<button type="button" class="tab-btn ' + (subjectPick === 'all' ? 'active' : '') + '" data-subject="all">전체</button>' +
                    '<button type="button" class="tab-btn ' + (subjectPick === 1 ? 'active' : '') + '" data-subject="1">데이터 이해</button>' +
                    '<button type="button" class="tab-btn ' + (subjectPick === 2 ? 'active' : '') + '" data-subject="2">분석 기획</button>' +
                    '<button type="button" class="tab-btn ' + (subjectPick === 3 ? 'active' : '') + '" data-subject="3">데이터 분석</button>' +
                    '</div>';

                var pickerHtml = '<div class="round-toggle-header"><span>출제 회차 선택</span>' +
                    '<button type="button" class="btn-link" id="toggleAllInfRoundsBtn">' + (roundPick.length === ROUNDS.length ? '전체 해제' : '전체 선택') + '</button></div>' +
                    '<div class="round-grid">' + ROUNDS.map(function (r) {
                        var active = roundPick.indexOf(r) !== -1;
                        return '<button type="button" class="round-card round-pick' + (active ? ' selected' : '') + '" data-round="' + r + '">' +
                            '<div class="round-num">' + r + '회</div>' +
                            '<div class="round-status">' + (active ? '선택됨' : '미선택') + '</div>' +
                            '</button>';
                    }).join('') + '</div>';

                var statusHtml = '<p class="lead">회차와 과목을 선택하면 그 범위에서 한 문제씩 무작위로 출제됩니다.</p>';
                if (!canStart) statusHtml += '<div class="notice">회차를 1개 이상 선택해주세요.</div>';
                if (matchesSaved && saved.stats.solved > 0) {
                    var acc = saved.stats.solved ? (saved.stats.correct / saved.stats.solved * 100) : 0;
                    statusHtml += '<p>진행 중인 기록이 있습니다. (' + saved.stats.solved + '문제 · 정답률 ' + fmt1(acc) + '%)</p>';
                }

                var actionsHtml = '<button type="button" class="btn btn-primary full" id="startInfinite" ' + (canStart ? '' : 'disabled') + '>' +
                    (matchesSaved ? '이어풀기' : '시작하기') + '</button>';

                app.innerHTML = headerHtml('무한 문제 풀이') + '<main class="container">' + subjectTabsHtml + pickerHtml + statusHtml + actionsHtml + '</main>';

                on('#homeBtn', 'click', function () { nav('home'); });
                on('#backBtn', 'click', function () { navBack(); });
                on('.tab-btn', 'click', function (e) {
                    var val = e.currentTarget.getAttribute('data-subject');
                    state.infSubjectPick = val === 'all' ? 'all' : parseInt(val, 10);
                    render();
                });
                on('.round-pick', 'click', function (e) {
                    var r = parseInt(e.currentTarget.getAttribute('data-round'), 10);
                    var idx = state.infRoundPick.indexOf(r);
                    if (idx === -1) state.infRoundPick.push(r); else state.infRoundPick.splice(idx, 1);
                    render();
                });
                on('#toggleAllInfRoundsBtn', 'click', function () {
                    state.infRoundPick = state.infRoundPick.length === ROUNDS.length ? [] : ROUNDS.slice();
                    render();
                });
                on('#startInfinite', 'click', function () {
                    if (matchesSaved) { nav('infinite'); return; }
                    function go() {

            /* ================= EXAM SESSION (mock & round shared) ================= */
            function buildChoiceOrders(ids) {
                var orders = {};
                ids.forEach(function (id) {
                    var q = questionById[id];
                    if (q.type === '객관식') orders[id] = shuffle(q.choices);
                });
                return orders;
            }
            function emptyMap(ids, val) {
                var m = {};
                ids.forEach(function (id) { m[id] = val; });
                return m;
            }
            function createMockSession(rounds) {
                var useRounds = rounds && rounds.length ? rounds : ROUNDS;
                var pool = poolQuestions.filter(function (q) { return useRounds.indexOf(q.round) !== -1; });
                var bySubj = { 1: [], 2: [], 3: [] };
                pool.forEach(function (q) { bySubj[q.subject_no].push(q.id); });
                function pick(arr, n) { return shuffle(arr).slice(0, n); }
                var ids = pick(bySubj[1], 10).concat(pick(bySubj[2], 10), pick(bySubj[3], 30));
                return {
                    v: SCHEMA_V, mode: 'mock', round: null,
                    rounds: useRounds.slice(),
                    questionIds: ids,
                    choiceOrder: buildChoiceOrders(ids),
                    answers: emptyMap(ids, null),
                    selfGrades: emptyMap(ids, null),
                    guessed: emptyMap(ids, false),
                    submitted: false, currentIndex: 0, startedAt: Date.now()
                };
            }
            function createRoundSession(round) {
                var ids = questionsByRound[round].map(function (q) { return q.id; });
                return {
                    v: SCHEMA_V, mode: 'round', round: round,
                    questionIds: ids,
                    choiceOrder: buildChoiceOrders(ids),
                    answers: emptyMap(ids, null),
                    selfGrades: emptyMap(ids, null),
                    guessed: emptyMap(ids, false),
                    submitted: false, currentIndex: 0, startedAt: Date.now()
                };
            }
            function createWrongSession(ids) {
                return {
                    v: SCHEMA_V, mode: 'wrong', round: null,
                    questionIds: ids,
                    choiceOrder: buildChoiceOrders(ids),
                    answers: emptyMap(ids, null),
                    selfGrades: emptyMap(ids, null),
                    guessed: emptyMap(ids, false),
                    submitted: false, currentIndex: 0
                };
            }
            function isAnswered(val) { return val !== null && val !== undefined && val !== ''; }

            function scoreExam(s) {
                var ids = s.questionIds;
                var subjTotals = { 1: { correct: 0, total: 0 }, 2: { correct: 0, total: 0 }, 3: { correct: 0, total: 0 } };
                var totalCorrect = 0;
                var ungraded = 0;
                var details = ids.map(function (id) {
                    var q = questionById[id];
                    var correct = false;
                    var userAnswerText = '';
                    if (q.type === '객관식') {
                        var idx = s.answers[id];
                        if (isAnswered(idx)) {
                            var val = s.choiceOrder[id][idx];
                            userAnswerText = val;
                            correct = q.answer.indexOf(val) !== -1;
                        }
                    } else {
                        userAnswerText = s.answers[id] || '';
                        var sg = s.selfGrades[id];
                        if (userAnswerText.trim() && sg === null) ungraded++;
                        correct = sg === 'correct';
                    }
                    subjTotals[q.subject_no].total++;
                    if (correct) { subjTotals[q.subject_no].correct++; totalCorrect++; }
                    return { id: id, q: q, correct: correct, userAnswerText: userAnswerText };
                });
                var totalCount = ids.length;
                var scorePercent = totalCount ? (totalCorrect * 100 / totalCount) : 0;
                var passTotal = totalCorrect * 5 >= totalCount * 3;
                var subjectResults = [1, 2, 3].map(function (no) {
                    var t = subjTotals[no];
                    var pct = t.total ? (t.correct * 100 / t.total) : 0;
                    var failing = !(t.correct * 5 >= t.total * 2);
                    return { subject_no: no, subject: SUBJECT_NAMES[no], correct: t.correct, total: t.total, pct: pct, failing: failing };
                });
                var anyFailing = subjectResults.some(function (r) { return r.failing; });
                var pass = passTotal && !anyFailing;
                return { details: details, subjectResults: subjectResults, totalCorrect: totalCorrect, totalCount: totalCount, scorePercent: scorePercent, pass: pass, anyFailing: anyFailing, ungraded: ungraded };
            }

            function collectWrongDetails() {
                var map = {};
                var mockS = loadState(KEY_MOCK, null);
                if (mockS && mockS.submitted) {
                    scoreExam(mockS).details.forEach(function (d) { if (!d.correct && !map[d.id]) map[d.id] = d; });
                }
                ROUNDS.forEach(function (r) {
                    var s = loadState(KEY_ROUND(r), null);
                    if (s && s.submitted) {
                        scoreExam(s).details.forEach(function (d) { if (!d.correct && !map[d.id]) map[d.id] = d; });
                    }
                });
                var infS = loadState(KEY_INFINITE, null);
                if (infS && infS.history) {
                    var latestInf = {};
                    infS.history.forEach(function (h) { latestInf[h.id] = h; });
                    Object.keys(latestInf).forEach(function (id) {
                        var h = latestInf[id];
                        if (!h.correct && !map[id]) {
                            map[id] = { id: id, q: questionById[id], correct: false, userAnswerText: h.answerText || '' };
                        }
                    });
                }
                return Object.keys(map).map(function (id) { return map[id]; }).sort(function (a, b) {
                    return a.q.round - b.q.round || a.q.globalNumber - b.q.globalNumber;
                });
            }
