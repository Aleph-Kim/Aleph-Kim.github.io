<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ADsP 기출문제 풀이</title>
<style>
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
:root{
  --bg:#f5f6f9;
  --surface:#ffffff;
  --border:#e2e5ea;
  --text:#1f2430;
  --text-muted:#6b7280;
  --primary:#3b5bdb;
  --primary-light:#eef1fd;
  --success:#2f9e44;
  --success-bg:#ebfbee;
  --danger:#e03131;
  --danger-bg:#fff0f0;
  --warning-bg:#fff9db;
  --warning-text:#8a5a00;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,0.06);
}
body{
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",sans-serif;
  font-size:16px;
  line-height:1.6;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;}
h1,h2,h3{font-family:inherit;}
.container{max-width:720px;margin:0 auto;padding:16px;}
.app-header{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);z-index:10;}
.header-row{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:720px;margin:0 auto;}
.header-row h1{font-size:18px;margin:0;flex:1;}
.btn-link{background:none;border:none;color:var(--primary);font-size:15px;cursor:pointer;padding:6px 0;font-weight:600;}

.lead{color:var(--text-muted);font-size:15px;margin:16px 0;}

.mode-list{display:flex;flex-direction:column;gap:12px;margin:20px 0;}
.mode-card{display:block;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;cursor:pointer;box-shadow:var(--shadow);width:100%;}
.mode-card h2{margin:0 0 6px;font-size:17px;}
.mode-card p{margin:0;color:var(--text-muted);font-size:14px;}

.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 18px;font-size:16px;border-radius:var(--radius);border:1.5px solid transparent;cursor:pointer;font-weight:600;}
.btn.full{width:100%;margin-bottom:10px;}
.btn.small{min-height:36px;padding:6px 12px;font-size:13px;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:disabled{background:#b7c1e0;cursor:not-allowed;}
.btn-outline{background:var(--surface);color:var(--text);border-color:var(--border);}
.btn-success{background:var(--success-bg);color:var(--success);border-color:var(--success);}
.btn-success.active{background:var(--success);color:#fff;}
.btn-danger{background:var(--danger-bg);color:var(--danger);border-color:var(--danger);}
.btn-danger.active{background:var(--danger);color:#fff;}
.btn-danger-outline{color:var(--danger);border-color:var(--danger);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
.q-source{font-size:13px;color:var(--text-muted);margin-bottom:10px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.q-type{background:var(--primary-light);color:var(--primary);padding:2px 8px;border-radius:20px;font-size:12px;font-weight:600;}
.q-text{font-size:17px;line-height:1.75;margin-bottom:18px;white-space:pre-wrap;}

.choices{display:flex;flex-direction:column;gap:10px;}
.choice-btn{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;font-size:16px;line-height:1.6;cursor:pointer;}
.choice-num{flex:0 0 auto;width:24px;height:24px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.choice-text{flex:1;word-break:break-word;padding-top:1px;}
.choice-tag{flex:0 0 auto;font-size:12px;font-weight:700;white-space:nowrap;}
.choice-btn.selected{border-color:var(--primary);background:var(--primary-light);}
.choice-btn.correct{border-color:var(--success);background:var(--success-bg);}
.choice-btn.incorrect{border-color:var(--danger);background:var(--danger-bg);}
.choice-btn:disabled{cursor:default;}

.text-answer{width:100%;min-height:96px;padding:12px 14px;font-size:16px;border:1.5px solid var(--border);border-radius:var(--radius);font-family:inherit;resize:vertical;}

.explanation-block{margin-top:16px;padding:14px 16px;background:var(--bg);border-left:4px solid var(--primary);border-radius:6px;font-size:15px;line-height:1.75;white-space:pre-wrap;}
.explanation-answer{font-weight:700;margin-bottom:6px;}

.self-grade{margin-top:14px;}
.self-grade p{margin:0 0 8px;font-size:14px;color:var(--text-muted);}
.self-grade-actions{display:flex;gap:10px;flex-wrap:wrap;}

.stat-bar{display:flex;gap:10px;margin:16px 0 10px;}
.stat-item{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px;text-align:center;}
.stat-num{display:block;font-size:22px;font-weight:700;}
.stat-label{font-size:12px;color:var(--text-muted);}

.action-row{margin:16px 0;}
.action-row.two-col{display:flex;gap:10px;}
.action-row.two-col .btn{flex:1;margin-bottom:0;}

.progress-line{font-size:14px;color:var(--text-muted);margin-bottom:10px;}

.qnav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin:16px 0;}
.qnav-btn{aspect-ratio:1;border:1.5px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px;cursor:pointer;color:var(--text);}
.qnav-btn.answered{background:var(--primary-light);border-color:var(--primary);color:var(--primary);}
.qnav-btn.current{border-color:var(--text);border-width:2.5px;}

.round-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0;}
.round-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center;cursor:pointer;}
.round-num{font-size:20px;font-weight:700;}
.round-status{font-size:13px;color:var(--text-muted);margin-top:4px;}
.round-card.status-pass .round-status{color:var(--success);font-weight:600;}
.round-card.status-fail .round-status{color:var(--danger);font-weight:600;}
.round-card.status-progress .round-status{color:#c17b00;font-weight:600;}
@media (min-width:480px){ .round-grid{grid-template-columns:repeat(4,1fr);} }

.result-banner{padding:20px;border-radius:var(--radius);text-align:center;font-size:20px;font-weight:700;margin:16px 0;}
.result-banner.pass{background:var(--success-bg);color:var(--success);}
.result-banner.fail{background:var(--danger-bg);color:var(--danger);}

.score-summary{font-size:16px;margin-bottom:14px;text-align:center;font-weight:600;}
.notice{background:var(--warning-bg);color:var(--warning-text);padding:12px 14px;border-radius:8px;font-size:14px;margin-bottom:14px;line-height:1.6;}

.table-wrap{overflow-x:auto;margin-bottom:16px;}
.subject-table{width:100%;border-collapse:collapse;font-size:14px;min-width:420px;}
.subject-table th,.subject-table td{padding:9px 10px;border-bottom:1px solid var(--border);text-align:center;}
.subject-table .fail-row td{color:var(--danger);font-weight:600;}

.filter-tabs{display:flex;gap:8px;margin:18px 0 10px;}
.tab-btn{flex:1;padding:10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer;font-size:14px;}
.tab-btn.active{background:var(--primary);color:#fff;border-color:var(--primary);}

.ox{font-weight:700;font-size:12px;padding:3px 9px;border-radius:20px;}
.ox-correct{background:var(--success-bg);color:var(--success);}
.ox-wrong{background:var(--danger-bg);color:var(--danger);}
.review-answers{font-size:14px;margin-bottom:8px;display:flex;flex-direction:column;gap:4px;}

.modal-overlay{position:fixed;inset:0;background:rgba(20,22,30,0.5);display:flex;align-items:center;justify-content:center;padding:20px;z-index:100;}
.modal-box{background:var(--surface);border-radius:var(--radius);padding:22px;max-width:360px;width:100%;}
.modal-box p{margin:0 0 18px;font-size:15px;line-height:1.6;white-space:pre-wrap;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;}
.modal-actions .btn{margin-bottom:0;}

footer.app-footer{text-align:center;color:var(--text-muted);font-size:12px;padding:24px 16px 40px;}
</style>
</head>

var ROUNDS = [13,14,15,16,17,18,19,20];

var KEY_INFINITE = 'adsp:infinite';
var KEY_MOCK = 'adsp:mock';
function KEY_ROUND(r){ return 'adsp:round:' + r; }
function ALL_KEYS(){
  var ks = [KEY_INFINITE, KEY_MOCK];
  ROUNDS.forEach(function(r){ ks.push(KEY_ROUND(r)); });
  return ks;
}

/* ---------- data load & preprocessing ---------- */
var raw = JSON.parse(document.getElementById('quiz-data').textContent);
var allQuestions = [];
raw.rounds.forEach(function(r){
  r.subjects.forEach(function(s){
    s.questions.forEach(function(q){
      var excluded = (r.round === 14 && s.subject_no === 3 && q.number === 24);
      var globalNumber = s.subject_no === 1 ? q.number : (s.subject_no === 2 ? q.number + 10 : q.number + 20);
      allQuestions.push({
        id: r.round + '_' + s.subject_no + '_' + q.number,
        round: r.round,
        subject_no: s.subject_no,
        subject: s.subject,
        number: q.number,
        globalNumber: globalNumber,
        question: q.question,
        answer: Array.isArray(q.answer) ? q.answer : [q.answer],
        explanation: q.explanation,
        choices: q.choices || [],
        type: q.type,
        excluded: excluded
      });
    });
  });
});
var questionById = {};
allQuestions.forEach(function(q){ questionById[q.id] = q; });
var poolQuestions = allQuestions.filter(function(q){ return !q.excluded; });
var questionsByRound = {};
ROUNDS.forEach(function(rn){
  questionsByRound[rn] = allQuestions.filter(function(q){ return q.round === rn && !q.excluded; })
    .sort(function(a,b){ return a.globalNumber - b.globalNumber; });
});

/* ---------- storage helpers ---------- */
function loadState(key, fallback){
  try{
    var s = localStorage.getItem(key);
    if(!s) return fallback;
    var obj = JSON.parse(s);
    if(!obj || obj.v !== SCHEMA_V) return fallback;
    return obj;
  }catch(e){ return fallback; }
}
function saveState(key, obj){
  try{ localStorage.setItem(key, JSON.stringify(obj)); }catch(e){ /* 저장 없이 진행 */ }
}
function removeState(key){
  try{ localStorage.removeItem(key); }catch(e){ /* ignore */ }
}

/* ---------- utils ---------- */
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function esc(str){
  var d = document.createElement('div');
  d.textContent = (str === null || str === undefined) ? '' : String(str);
  return d.innerHTML;
}
function fmt1(n){
  return (Math.round(n * 10) / 10).toFixed(1);
}
function on(sel, evt, handler){
  var els = app.querySelectorAll(sel);
  els.forEach(function(el){ el.addEventListener(evt, handler); });
}

/* ---------- modal ---------- */
function confirmModal(message, onYes){
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  var box = document.createElement('div');
  box.className = 'modal-box';
  var p = document.createElement('p');
  p.textContent = message;
  var actions = document.createElement('div');
  actions.className = 'modal-actions';
  var cancelBtn = document.createElement('button');
  cancelBtn.className = 'btn btn-outline';
  cancelBtn.textContent = '취소';
  var okBtn = document.createElement('button');
  okBtn.className = 'btn btn-primary';
  okBtn.textContent = '확인';
  actions.appendChild(cancelBtn);
  actions.appendChild(okBtn);
  box.appendChild(p);
  box.appendChild(actions);
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  function close(){
    if(overlay.parentNode) document.body.removeChild(overlay);
    document.removeEventListener('keydown', onKey);
  }
  function onKey(e){ if(e.key === 'Escape') close(); }
  document.addEventListener('keydown', onKey);
  cancelBtn.addEventListener('click', close);
  okBtn.addEventListener('click', function(){ close(); onYes(); });
}

/* ---------- app state ---------- */
var app = document.getElementById('app');
var state = { screen: 'home' };

function nav(screen, extra){
  state = Object.assign({ screen: screen }, extra || {});
  render();
  window.scrollTo(0, 0);
}

function render(){
  if(state.screen === 'home') renderHome();
  else if(state.screen === 'infinite') renderInfinite();
  else if(state.screen === 'mockHub') renderMockHub();
  else if(state.screen === 'mockSolve') renderExamSolve('mock');
  else if(state.screen === 'mockResult') renderExamResult('mock');
  else if(state.screen === 'roundHub') renderRoundHub();
  else if(state.screen === 'roundSolve') renderExamSolve('round');
  else if(state.screen === 'roundResult') renderExamResult('round');

/* ================= INFINITE MODE ================= */
function defaultInfiniteState(){
  return { v: SCHEMA_V, stats: { solved: 0, correct: 0 }, pool: shuffle(poolQuestions.map(function(q){ return q.id; })), current: null };
}
function getInfiniteState(){
  var s = loadState(KEY_INFINITE, null);
  if(!s){ s = defaultInfiniteState(); saveState(KEY_INFINITE, s); }
  return s;
}
function drawNextInfinite(s){
  if(s.pool.length === 0){
    s.pool = shuffle(poolQuestions.map(function(q){ return q.id; }));
  }
  var id = s.pool.pop();
  var q = questionById[id];
  var choiceOrder = q.type === '객관식' ? shuffle(q.choices) : null;
  s.current = { id: id, choiceOrder: choiceOrder, selectedIndex: null, typed: '', revealed: false, selfGrade: null, graded: false };
}

function renderInfinite(){
  var s = getInfiniteState();
  if(!s.current){ drawNextInfinite(s); saveState(KEY_INFINITE, s); }
  var cur = s.current;
  var q = questionById[cur.id];
  var acc = s.stats.solved ? (s.stats.correct / s.stats.solved * 100) : 0;

  var choicesHtml = '';
  if(q.type === '객관식'){
    choicesHtml = cur.choiceOrder.map(function(val, i){
      var cls = 'choice-btn';
      var tag = '';
      var disabled = '';
      if(cur.revealed){
        disabled = 'disabled';
        var isAnswer = q.answer.indexOf(val) !== -1;
        var isSelected = cur.selectedIndex === i;
        if(isAnswer){ cls += ' correct'; tag = '<span class="choice-tag">✓ 정답</span>'; }
        else if(isSelected){ cls += ' incorrect'; tag = '<span class="choice-tag">✗ 오답</span>'; }
      } else if(cur.selectedIndex === i){
        cls += ' selected';
      }
      return '<button type="button" class="' + cls + '" data-idx="' + i + '" ' + disabled + '>' +
        '<span class="choice-num">' + (i+1) + '</span>' +
        '<span class="choice-text">' + esc(val) + '</span>' + tag +
        '</button>';
    }).join('');
  } else {
    choicesHtml = '<textarea id="typedAnswer" class="text-answer" placeholder="답을 입력하세요"' + (cur.revealed ? ' disabled' : '') + '>' + esc(cur.typed) + '</textarea>';
  }

  var revealHtml = '';
  if(cur.revealed){
    revealHtml = '<div class="explanation-block">' +
      '<div class="explanation-answer">정답: ' + esc(q.answer.join(' / ')) + '</div>' +
      '<div>' + esc(q.explanation) + '</div>' +
      '</div>';
    if(q.type !== '객관식'){
      revealHtml += '<div class="self-grade"><p>내 답을 직접 채점해주세요.</p><div class="self-grade-actions">' +
        '<button type="button" class="btn btn-success ' + (cur.selfGrade === 'correct' ? 'active' : '') + '" id="gradeCorrect">✓ 정답</button>' +
        '<button type="button" class="btn btn-danger ' + (cur.selfGrade === 'incorrect' ? 'active' : '') + '" id="gradeIncorrect">✗ 오답</button>' +
        '</div></div>';
    }
  }

  var canCheck = q.type === '객관식' ? cur.selectedIndex !== null : cur.typed.trim().length > 0;

  app.innerHTML =
    headerHtml('무한 문제 풀이') +
    '<main class="container">' +
      '<div class="stat-bar">' +
        '<div class="stat-item"><span class="stat-num">' + s.stats.solved + '</span><span class="stat-label">푼 문제 수</span></div>' +
        '<div class="stat-item"><span class="stat-num">' + s.stats.correct + '</span><span class="stat-label">맞은 수</span></div>' +
        '<div class="stat-item"><span class="stat-num">' + fmt1(acc) + '%</span><span class="stat-label">정답률</span></div>' +
      '</div>' +
      '<button type="button" class="btn btn-outline small" id="resetInfBtn">기록 초기화</button>' +
      '<div class="card question-card">' +
        '<div class="q-source">' + q.round + '회차 · ' + esc(q.subject) + ' · ' + q.globalNumber + '번 <span class="q-type">' + esc(q.type) + '</span></div>' +
        '<div class="q-text">' + esc(q.question) + '</div>' +
        '<div class="choices">' + choicesHtml + '</div>' +
        revealHtml +
      '</div>' +
      '<div class="action-row">' +
        (!cur.revealed
          ? '<button type="button" class="btn btn-primary full" id="checkBtn" ' + (canCheck ? '' : 'disabled') + '>정답 확인</button>'
          : '<button type="button" class="btn btn-primary full" id="nextBtn" ' + (cur.graded ? '' : 'disabled') + '>다음 문제</button>') +
      '</div>' +
    '</main>';

  on('#homeBtn', 'click', function(){ nav('home'); });
  on('#resetInfBtn', 'click', function(){
    confirmModal('무한 문제 풀이 통계와 진행 기록을 초기화합니다. 계속할까요?', function(){
      saveState(KEY_INFINITE, defaultInfiniteState());
      render();
    });
  });

  if(q.type === '객관식'){
    on('.choice-btn', 'click', function(e){
      if(cur.revealed) return;
      cur.selectedIndex = parseInt(e.currentTarget.getAttribute('data-idx'), 10);
      saveState(KEY_INFINITE, s);
      render();
    });
  } else {
    var ta = document.getElementById('typedAnswer');
    if(ta){
      ta.addEventListener('input', function(){
        cur.typed = ta.value;
        saveState(KEY_INFINITE, s);
        var checkBtn = document.getElementById('checkBtn');
        if(checkBtn) checkBtn.disabled = cur.typed.trim().length === 0;
      });
    }
  }

  on('#checkBtn', 'click', function(){
    cur.revealed = true;
    if(q.type === '객관식'){
      var val = cur.choiceOrder[cur.selectedIndex];
      var isCorrect = q.answer.indexOf(val) !== -1;
      cur.graded = true;
      s.stats.solved += 1;
      if(isCorrect) s.stats.correct += 1;
    }
    saveState(KEY_INFINITE, s);
    render();
  });
  on('#nextBtn', 'click', function(){
    s.current = null;
    saveState(KEY_INFINITE, s);
    render();
  });
  on('#gradeCorrect', 'click', function(){
    if(cur.graded) return;
    cur.selfGrade = 'correct';
    cur.graded = true;
    s.stats.solved += 1;
    s.stats.correct += 1;
    saveState(KEY_INFINITE, s);
    render();
  });
  on('#gradeIncorrect', 'click', function(){
    if(cur.graded) return;
    cur.selfGrade = 'incorrect';
    cur.graded = true;
    s.stats.solved += 1;
    saveState(KEY_INFINITE, s);
    render();
  });
}

/* ================= EXAM SESSION (mock & round shared) ================= */
function buildChoiceOrders(ids){
  var orders = {};
  ids.forEach(function(id){
    var q = questionById[id];
    if(q.type === '객관식') orders[id] = shuffle(q.choices);
  });
  return orders;
}
function emptyMap(ids, val){
  var m = {};
  ids.forEach(function(id){ m[id] = val; });
  return m;
}
function createMockSession(){
  var bySubj = {1: [], 2: [], 3: []};
  poolQuestions.forEach(function(q){ bySubj[q.subject_no].push(q.id); });
  function pick(arr, n){ return shuffle(arr).slice(0, n); }
  var ids = pick(bySubj[1], 10).concat(pick(bySubj[2], 10), pick(bySubj[3], 30));
  return {
    v: SCHEMA_V, mode: 'mock', round: null,
    questionIds: ids,
    choiceOrder: buildChoiceOrders(ids),
    answers: emptyMap(ids, null),
    selfGrades: emptyMap(ids, null),
    submitted: false, currentIndex: 0
  };
}
function createRoundSession(round){
  var ids = questionsByRound[round].map(function(q){ return q.id; });
  return {
    v: SCHEMA_V, mode: 'round', round: round,
    questionIds: ids,
    choiceOrder: buildChoiceOrders(ids),
    answers: emptyMap(ids, null),
    selfGrades: emptyMap(ids, null),
    submitted: false, currentIndex: 0
  };
}
function isAnswered(val){ return val !== null && val !== undefined && val !== ''; }

function scoreExam(s){
  var ids = s.questionIds;
  var subjTotals = {1: {correct:0,total:0}, 2: {correct:0,total:0}, 3: {correct:0,total:0}};
  var totalCorrect = 0;
  var ungraded = 0;
  var details = ids.map(function(id){
    var q = questionById[id];
    var correct = false;
    var userAnswerText = '';
    if(q.type === '객관식'){
      var idx = s.answers[id];
      if(isAnswered(idx)){
        var val = s.choiceOrder[id][idx];
        userAnswerText = val;
        correct = q.answer.indexOf(val) !== -1;
      }
    } else {
      userAnswerText = s.answers[id] || '';
      var sg = s.selfGrades[id];
      if(userAnswerText.trim() && sg === null) ungraded++;
      correct = sg === 'correct';
    }
    subjTotals[q.subject_no].total++;
    if(correct){ subjTotals[q.subject_no].correct++; totalCorrect++; }
    return { id: id, q: q, correct: correct, userAnswerText: userAnswerText };
  });
  var totalCount = ids.length;
  var scorePercent = totalCount ? (totalCorrect * 100 / totalCount) : 0;
  var passTotal = totalCorrect * 5 >= totalCount * 3;
  var subjectResults = [1,2,3].map(function(no){
    var t = subjTotals[no];
    var pct = t.total ? (t.correct * 100 / t.total) : 0;
    var failing = !(t.correct * 5 >= t.total * 2);
    return { subject_no: no, subject: SUBJECT_NAMES[no], correct: t.correct, total: t.total, pct: pct, failing: failing };
  });
  var anyFailing = subjectResults.some(function(r){ return r.failing; });
  var pass = passTotal && !anyFailing;
  return { details: details, subjectResults: subjectResults, totalCorrect: totalCorrect, totalCount: totalCount, scorePercent: scorePercent, pass: pass, anyFailing: anyFailing, ungraded: ungraded };
}

/* ---------- EXAM SOLVE (shared) ---------- */
function renderExamSolve(mode){
  var round = mode === 'round' ? state.round : null;
  var key = mode === 'mock' ? KEY_MOCK : KEY_ROUND(round);
  var s = loadState(key, null);
  if(!s){
    s = mode === 'mock' ? createMockSession() : createRoundSession(round);
    saveState(key, s);
  }
  var ids = s.questionIds;
  var idx = Math.max(0, Math.min(s.currentIndex || 0, ids.length - 1));
  s.currentIndex = idx;
  var id = ids[idx];
  var q = questionById[id];

  var bodyHtml = '';
  if(q.type === '객관식'){
    var order = s.choiceOrder[id];
    var selIdx = s.answers[id];
    bodyHtml = order.map(function(val, i){
      var cls = 'choice-btn' + (selIdx === i ? ' selected' : '');
      return '<button type="button" class="' + cls + '" data-idx="' + i + '">' +
        '<span class="choice-num">' + (i+1) + '</span>' +
        '<span class="choice-text">' + esc(val) + '</span>' +
        '</button>';
    }).join('');
  } else {
    var typed = s.answers[id] || '';
    bodyHtml = '<textarea id="typedAnswer" class="text-answer" placeholder="답을 입력하세요">' + esc(typed) + '</textarea>';
  }

  var navGrid = ids.map(function(qid, i){
    var answered = isAnswered(s.answers[qid]);
    var cls = 'qnav-btn' + (answered ? ' answered' : '') + (i === idx ? ' current' : '');
    return '<button type="button" class="' + cls + '" data-jump="' + i + '">' + (i+1) + '</button>';
  }).join('');

  var title = mode === 'mock' ? '모의고사' : (round + '회 회차별 풀이');

  app.innerHTML = headerHtml(title) +
    '<main class="container">' +
      '<div class="progress-line">' + (idx+1) + ' / ' + ids.length + '문항</div>' +
      '<div class="card question-card">' +
        '<div class="q-source">' + q.round + '회차 · ' + esc(q.subject) + ' · ' + q.globalNumber + '번 <span class="q-type">' + esc(q.type) + '</span></div>' +
        '<div class="q-text">' + esc(q.question) + '</div>' +
        '<div class="choices">' + bodyHtml + '</div>' +
      '</div>' +
      '<div class="action-row two-col">' +
        '<button type="button" class="btn btn-outline" id="prevBtn" ' + (idx===0?'disabled':'') + '>이전</button>' +
        '<button type="button" class="btn btn-outline" id="nextBtn" ' + (idx===ids.length-1?'disabled':'') + '>다음</button>' +
      '</div>' +
      '<div class="qnav-grid">' + navGrid + '</div>' +
      '<button type="button" class="btn btn-primary full" id="submitBtn">제출</button>' +
    '</main>';

  saveState(key, s);

  on('#homeBtn', 'click', function(){ nav('home'); });
  on('#prevBtn', 'click', function(){ s.currentIndex = idx - 1; saveState(key, s); render(); });
  on('#nextBtn', 'click', function(){ s.currentIndex = idx + 1; saveState(key, s); render(); });
  on('.qnav-btn', 'click', function(e){
    s.currentIndex = parseInt(e.currentTarget.getAttribute('data-jump'), 10);
    saveState(key, s);
    render();
  });

  if(q.type === '객관식'){
    on('.choice-btn', 'click', function(e){
      s.answers[id] = parseInt(e.currentTarget.getAttribute('data-idx'), 10);
      saveState(key, s);
      render();
    });
  } else {
    var ta = document.getElementById('typedAnswer');
    if(ta){
      ta.addEventListener('input', function(){
        s.answers[id] = ta.value;
        saveState(key, s);
        var curBtn = app.querySelector('.qnav-btn.current');
        if(curBtn){
          if(ta.value.trim().length > 0) curBtn.classList.add('answered');
          else curBtn.classList.remove('answered');
        }
      });
    }
  }

  on('#submitBtn', 'click', function(){
    var unanswered = ids.filter(function(qid){ return !isAnswered(s.answers[qid]); }).length;
    var msg = unanswered > 0
      ? ('미응답 문항이 ' + unanswered + '개 있습니다. 제출하시겠습니까?')
      : '모든 문항에 응답했습니다. 제출하시겠습니까?';
    confirmModal(msg, function(){
      s.submitted = true;
      s.submittedAt = Date.now();
      saveState(key, s);
      nav(mode === 'mock' ? 'mockResult' : 'roundResult', mode === 'round' ? { round: round } : {});
    });
  });
}

/* ---------- EXAM RESULT (shared) ---------- */
function renderExamResult(mode){
  var round = mode === 'round' ? state.round : null;
  var key = mode === 'mock' ? KEY_MOCK : KEY_ROUND(round);
  var s = loadState(key, null);
  if(!s || !s.submitted){
    nav(mode === 'mock' ? 'mockHub' : 'roundHub');
    return;
  }
  var filter = state.reviewFilter || 'all';
  var result = scoreExam(s);
  var failingNames = result.subjectResults.filter(function(r){ return r.failing; }).map(function(r){ return r.subject; });

  var bannerHtml = result.pass
    ? '<div class="result-banner pass">✓ 합격</div>'
    : '<div class="result-banner fail">✗ 불합격' + (failingNames.length ? ' — 과락 과목: ' + esc(failingNames.join(', ')) : '') + '</div>';

  var ungradedNotice = result.ungraded > 0
    ? '<div class="notice">자가채점이 필요한 서술형 문항이 ' + result.ungraded + '개 있습니다. 아래 문항 리뷰에서 정답/오답을 선택해주세요. 채점 후 점수가 갱신됩니다.</div>'
    : '';
  var round14Notice = (mode === 'round' && round === 14)
    ? '<div class="notice">14회 24번은 시험범위 밖 출제로 전항 정답처리된 문항이라 제외되었습니다.</div>'
    : '';

  var subjectTableHtml = '<div class="table-wrap"><table class="subject-table"><thead><tr>' +
    '<th>과목</th><th>맞은 수</th><th>총 문항</th><th>정답률</th><th>과락</th></tr></thead><tbody>' +
    result.subjectResults.map(function(r){
      return '<tr class="' + (r.failing ? 'fail-row' : '') + '">' +
        '<td>' + esc(r.subject) + '</td><td>' + r.correct + '</td><td>' + r.total + '</td>' +
        '<td>' + fmt1(r.pct) + '%</td><td>' + (r.failing ? '과락' : '-') + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  var filteredDetails = filter === 'wrong' ? result.details.filter(function(d){ return !d.correct; }) : result.details;

  var reviewHtml = filteredDetails.map(function(d){
    var q = d.q;
    var oxHtml = d.correct ? '<span class="ox ox-correct">✓ 정답</span>' : '<span class="ox ox-wrong">✗ 오답</span>';
    var selfGradeHtml = '';
    if(q.type !== '객관식'){
      var sg = s.selfGrades[q.id];
      selfGradeHtml = '<div class="self-grade"><div class="self-grade-actions">' +
        '<button type="button" class="btn btn-success small ' + (sg === 'correct' ? 'active' : '') + '" data-sg="correct" data-qid="' + q.id + '">✓ 정답으로 표시</button>' +
        '<button type="button" class="btn btn-danger small ' + (sg === 'incorrect' ? 'active' : '') + '" data-sg="incorrect" data-qid="' + q.id + '">✗ 오답으로 표시</button>' +
        '</div></div>';
    }
    return '<div class="card review-item">' +
      '<div class="q-source">' + q.round + '회차 · ' + esc(q.subject) + ' · ' + q.globalNumber + '번 ' + oxHtml + '</div>' +
      '<div class="q-text">' + esc(q.question) + '</div>' +
      '<div class="review-answers">' +
        '<div>내 답: ' + esc(d.userAnswerText || '') + (d.userAnswerText ? '' : '미응답') + '</div>' +
        '<div>정답: ' + esc(q.answer.join(' / ')) + '</div>' +
      '</div>' +
      '<div class="explanation-block">' + esc(q.explanation) + '</div>' +
      selfGradeHtml +
      '</div>';
  }).join('');

  var title = mode === 'mock' ? '모의고사 결과' : (round + '회 결과');

  app.innerHTML = headerHtml(title) +
    '<main class="container">' +
      bannerHtml +
      '<div class="score-summary">총점 ' + fmt1(result.scorePercent) + '점 (' + result.totalCorrect + ' / ' + result.totalCount + ' 정답)</div>' +
      round14Notice +
      ungradedNotice +
      subjectTableHtml +
      '<div class="filter-tabs">' +
        '<button type="button" class="tab-btn ' + (filter==='all'?'active':'') + '" data-filter="all">전체 보기</button>' +
        '<button type="button" class="tab-btn ' + (filter==='wrong'?'active':'') + '" data-filter="wrong">오답만 보기</button>' +
      '</div>' +
      '<div class="review-list">' + (reviewHtml || '<p class="lead">해당하는 문항이 없습니다.</p>') + '</div>' +
      '<button type="button" class="btn btn-primary full" id="retryBtn">다시 풀기</button>' +
    '</main>';

  on('#homeBtn', 'click', function(){ nav('home'); });
  on('.tab-btn', 'click', function(e){
    state.reviewFilter = e.currentTarget.getAttribute('data-filter');
    render();
  });
  on('[data-sg]', 'click', function(e){
    var qid = e.currentTarget.getAttribute('data-qid');
    var grade = e.currentTarget.getAttribute('data-sg');
    s.selfGrades[qid] = grade;
    saveState(key, s);
    render();
  });
  on('#retryBtn', 'click', function(){
    var msg = mode === 'mock'
      ? '새 모의고사를 시작합니다. 현재 결과는 새 시험으로 대체됩니다. 계속할까요?'
      : (round + '회 문제를 다시 풉니다. 진행 기록이 초기화됩니다. 계속할까요?');
    confirmModal(msg, function(){
      if(mode === 'mock'){
        saveState(KEY_MOCK, createMockSession());
        nav('mockSolve');
      } else {
        saveState(KEY_ROUND(round), createRoundSession(round));
        nav('roundSolve', { round: round });
      }
    });
  });
}

render();
})();
</script>
</body>
</html>
