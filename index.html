                var cards = ROUNDS.map(function (r) {
                    var s = loadState(KEY_ROUND(r), null);
                    var total = questionsByRound[r].length;
                    var statusText, statusClass;
                    if (!s) { statusText = '미시작'; statusClass = ''; }
                    else if (!s.submitted) {
                        var answered = s.questionIds.filter(function (id) { return isAnswered(s.answers[id]); }).length;
                        statusText = '진행 중 ' + answered + '/' + total;
                        statusClass = 'status-progress';
                    } else {
                        var result = scoreExam(s);
                        statusText = '완료 · ' + fmt1(result.scorePercent) + '점';
                        statusClass = result.pass ? 'status-pass' : 'status-fail';
                    }
                    return '<button type="button" class="round-card ' + statusClass + '" data-round="' + r + '">' +
                        '<div class="round-num">' + r + '회</div>' +
                        '<div class="round-status">' + statusText + '</div>' +
                        '</button>';
                }).join('');

                var roundRange = ROUNDS[0] + '~' + ROUNDS[ROUNDS.length - 1] + '회';
                app.innerHTML = headerHtml('회차별 문제 풀이') +
                    '<main class="container">' +
                    '<p class="lead">' + roundRange + ' 중 하나를 선택하세요. (14회는 24번 제외 49문항)</p>' +
                    '<div class="round-grid">' + cards + '</div>' +
                    '</main>';

                on('#homeBtn', 'click', function () { nav('home'); });
                on('#backBtn', 'click', function () { navBack(); });
                on('.round-card', 'click', function (e) {
                    var r = parseInt(e.currentTarget.getAttribute('data-round'), 10);
                    var s = loadState(KEY_ROUND(r), null);
                    if (!s) {
                        saveState(KEY_ROUND(r), createRoundSession(r));
                        nav('roundSolve', { round: r });
                    } else if (!s.submitted) {
                        nav('roundSolve', { round: r });
                    } else {
                        nav('roundResult', { round: r });
                    }
                });
            }

            /* ---------- EXAM SOLVE (shared) ---------- */
            function renderExamSolve(mode) {
                var round = mode === 'round' ? state.round : null;
                var key = mode === 'mock' ? KEY_MOCK : (mode === 'round' ? KEY_ROUND(round) : KEY_WRONG);
                var s = loadState(key, null);
                if (!s) {
                    s = mode === 'mock' ? createMockSession() : (mode === 'round' ? createRoundSession(round) : createWrongSession(collectWrongDetails().map(function (d) { return d.id; })));
                    saveState(key, s);
                }
                if (!s.guessed) s.guessed = emptyMap(s.questionIds, false);
                if (mode !== 'wrong' && !s.startedAt) s.startedAt = Date.now();
                var ids = s.questionIds;
                var idx = Math.max(0, Math.min(s.currentIndex || 0, ids.length - 1));
                s.currentIndex = idx;
                var id = ids[idx];
                var q = questionById[id];

                var bodyHtml = '';
                if (q.type === '객관식') {
                    var order = s.choiceOrder[id];
                    var selIdx = s.answers[id];
                    var isGuessed = !!s.guessed[id];
                    bodyHtml = order.map(function (val, i) {
                        var cls = 'choice-btn' + (selIdx === i ? ' selected' : '');
                        var guessCls = 'guess-tag' + (isGuessed && selIdx === i ? ' active' : '');
                        return '<button type="button" class="' + cls + '" data-idx="' + i + '">' +
                            '<span class="choice-num-col">' +
                            '<span class="choice-num">' + (i + 1) + '</span>' +
                            '<span class="' + guessCls + '" data-guess-idx="' + i + '">찍기</span>' +
                            '</span>' +
                            '<span class="choice-text">' + esc(val) + '</span>' +
                            '</button>';
                    }).join('');
                } else {
                    var typed = s.answers[id] || '';
                    bodyHtml = '<textarea id="typedAnswer" class="text-answer" placeholder="답을 입력하세요">' + esc(typed) + '</textarea>';
                }

                var navGrid = ids.map(function (qid, i) {
                    var answered = isAnswered(s.answers[qid]);
                    var cls = 'qnav-btn' + (answered ? ' answered' : '') + (i === idx ? ' current' : '');
                    return '<button type="button" class="' + cls + '" data-jump="' + i + '">' + (i + 1) + '</button>';
                }).join('');

                var title = mode === 'mock' ? '모의고사' : (mode === 'round' ? (round + '회 회차별 풀이') : '틀린 문제 다시 풀기');

                var timerHtml = mode !== 'wrong' ? ' · <span id="examTimer">' + fmtDuration(Date.now() - s.startedAt) + '</span>' : '';

                app.innerHTML = headerHtml(title) +
                    '<main class="container exam-container">' +
                    '<div class="progress-line">' + (idx + 1) + ' / ' + ids.length + '문항' + timerHtml + '</div>' +
                    '<div class="card question-card">' +
                    '<div class="q-source">' + q.round + '회차 · ' + esc(q.subject) + ' · ' + q.globalNumber + '번 <span class="q-type">' + esc(q.type) + '</span></div>' +
                    '<div class="q-text">' + esc(q.question) + '</div>' +
                    (q.reference ? '<div class="q-reference">' + renderRefMd(q.reference) + '</div>' : '') +
                    '<div class="choices">' + bodyHtml + '</div>' +
                    '</div>' +
                    '<div class="action-row two-col">' +
                    '<button type="button" class="btn btn-outline" id="prevBtn" ' + (idx === 0 ? 'disabled' : '') + '>이전</button>' +
                    '<button type="button" class="btn btn-outline" id="nextBtn" ' + (idx === ids.length - 1 ? 'disabled' : '') + '>다음</button>' +
                    '</div>' +
                    '<div class="qnav-grid">' + navGrid + '</div>' +
                    '<button type="button" class="btn btn-primary full" id="submitBtn">제출</button>' +
                    '</main>';

                saveState(key, s);

                if (mode !== 'wrong') {
                    examTimerHandle = setInterval(function () {
                        var el = document.getElementById('examTimer');
                        if (el) el.textContent = fmtDuration(Date.now() - s.startedAt);
                    }, 1000);
                }

                on('#homeBtn', 'click', function () { nav('home'); });
                on('#backBtn', 'click', function () { navBack(); });
                on('#prevBtn', 'click', function () { s.currentIndex = idx - 1; saveState(key, s); render(); window.scrollTo(0, 0); });
                on('#nextBtn', 'click', function () { s.currentIndex = idx + 1; saveState(key, s); render(); window.scrollTo(0, 0); });
                on('.qnav-btn', 'click', function (e) {
                    s.currentIndex = parseInt(e.currentTarget.getAttribute('data-jump'), 10);
                    saveState(key, s);
                    render();
                    window.scrollTo(0, 0);
                });

                if (q.type === '객관식') {
                    on('.choice-btn', 'click', function (e) {
                        var clickedIdx = parseInt(e.currentTarget.getAttribute('data-idx'), 10);
                        s.answers[id] = s.answers[id] === clickedIdx ? null : clickedIdx;
                        s.guessed[id] = false;
                        saveState(key, s);
                        render();
                    });
                    on('.guess-tag', 'click', function (e) {
                        e.stopPropagation();
                        var i = parseInt(e.currentTarget.getAttribute('data-guess-idx'), 10);
                        if (s.answers[id] === i && s.guessed[id]) {
                            s.answers[id] = null;
                            s.guessed[id] = false;
                        } else {
                            s.answers[id] = i;
                            s.guessed[id] = true;
                        }
                        saveState(key, s);
                        render();
                    });
                } else {
                    var ta = document.getElementById('typedAnswer');
                    if (ta) {
                        ta.addEventListener('input', function () {
                            s.answers[id] = ta.value;
                            saveState(key, s);
                            var curBtn = app.querySelector('.qnav-btn.current');
                            if (curBtn) {
                                if (ta.value.trim().length > 0) curBtn.classList.add('answered');
                                else curBtn.classList.remove('answered');
                            }
                        });
                    }
                }

                on('#submitBtn', 'click', function () {
                    var unanswered = ids.filter(function (qid) { return !isAnswered(s.answers[qid]); }).length;
                    var msg = unanswered > 0
                        ? ('미응답 문항이 ' + unanswered + '개 있습니다. 제출하시겠습니까?')
                        : '모든 문항에 응답했습니다. 제출하시겠습니까?';
                    confirmModal(msg, function () {
                        s.submitted = true;
                        s.submittedAt = Date.now();
                        saveState(key, s);
                        nav(mode === 'mock' ? 'mockResult' : (mode === 'round' ? 'roundResult' : 'wrongResult'), mode === 'round' ? { round: round } : {});
                    });
                });
            }

            /* ---------- EXAM RESULT (shared) ---------- */
            function renderExamResult(mode) {
                var round = mode === 'round' ? state.round : null;
                var isWrongMode = mode === 'wrong';
                var key = mode === 'mock' ? KEY_MOCK : (mode === 'round' ? KEY_ROUND(round) : KEY_WRONG);
                var s = loadState(key, null);
                if (!s || !s.submitted) {
                    nav(mode === 'mock' ? 'mockHub' : (mode === 'round' ? 'roundHub' : 'wrongList'));
                    return;
                }
                if (!s.guessed) s.guessed = emptyMap(s.questionIds, false);
                var filter = state.reviewFilter || 'all';
                var result = scoreExam(s);
                var failingNames = result.subjectResults.filter(function (r) { return r.failing; }).map(function (r) { return r.subject; });

                var bannerHtml = isWrongMode ? '' : (result.pass
                    ? '<div class="result-banner pass">' + ICON_CHECK + ' 합격</div>'
                    : '<div class="result-banner fail">' + ICON_X + ' 불합격' + (failingNames.length ? ' — 과락 과목: ' + esc(failingNames.join(', ')) : '') + '</div>');

                var ungradedNotice = result.ungraded > 0
                    ? '<div class="notice">자가채점이 필요한 서술형 문항이 ' + result.ungraded + '개 있습니다. 아래 문항 리뷰에서 정답/오답을 선택해주세요. 채점 후 점수가 갱신됩니다.</div>'
                    : '';
                var round14Notice = (mode === 'round' && round === 14)
                    ? '<div class="notice">14회 24번은 시험범위 밖 출제로 전항 정답처리된 문항이라 제외되었습니다.</div>'
                    : '';

                var subjectTableHtml = isWrongMode ? '' : ('<div class="table-wrap"><table class="subject-table"><thead><tr>' +
                    '<th>과목</th><th>맞은 수</th><th>총 문항</th><th>정답률</th><th>과락</th></tr></thead><tbody>' +
                    result.subjectResults.map(function (r) {
                        return '<tr class="' + (r.failing ? 'fail-row' : '') + '">' +
                            '<td>' + esc(r.subject) + '</td><td>' + r.correct + '</td><td>' + r.total + '</td>' +
                            '<td>' + fmt1(r.pct) + '%</td><td>' + (r.failing ? '과락' : '-') + '</td></tr>';
                    }).join('') + '</tbody></table></div>');

                var filteredDetails = filter === 'wrong' ? result.details.filter(function (d) { return !d.correct; })
                    : (filter === 'guess' ? result.details.filter(function (d) { return s.guessed[d.id]; }) : result.details);

                var reviewHtml = filteredDetails.map(function (d) {
                    var q = d.q;
                    var oxHtml = d.correct ? '<span class="ox ox-correct">' + ICON_CHECK + ' 정답</span>' : '<span class="ox ox-wrong">' + ICON_X + ' 오답</span>';
                    var guessHtml = s.guessed[d.id] ? '<span class="ox ox-guess">찍음</span>' : '';
                    var selfGradeHtml = '';
                    var answerHtml;
                    if (q.type === '객관식') {
                        var order = s.choiceOrder[q.id];
                        var selIdx = s.answers[q.id];
                        answerHtml = '<div class="choices review-choices">' + order.map(function (val, i) {
                            var cls = 'choice-btn';
                            var tag = '';
                            var isAnswer = q.answer.indexOf(val) !== -1;
                            var isSelected = selIdx === i;
                            if (isAnswer) { cls += ' correct'; tag = '<span class="choice-tag">' + ICON_CHECK + ' 정답</span>'; }
                            else if (isSelected) { cls += ' incorrect'; tag = '<span class="choice-tag">' + ICON_X + ' 오답</span>'; }
                            return '<button type="button" class="' + cls + '" disabled>' +
                                '<span class="choice-num">' + (i + 1) + '</span>' +
                                '<span class="choice-text">' + esc(val) + '</span>' + tag +
                                '</button>';
                        }).join('') + '</div>';
                    } else {
                        var sg = s.selfGrades[q.id];
                        answerHtml = '<div class="review-answers">' +
                            '<div>내 답: ' + esc(d.userAnswerText || '') + (d.userAnswerText ? '' : '미응답') + '</div>' +
                            '<div>정답: ' + esc(q.answer.join(' / ')) + '</div>' +
                            '</div>';
                        selfGradeHtml = '<div class="self-grade"><div class="self-grade-actions">' +
                            '<button type="button" class="btn btn-success small ' + (sg === 'correct' ? 'active' : '') + '" data-sg="correct" data-qid="' + q.id + '">' + ICON_CHECK + ' 정답으로 표시</button>' +
                            '<button type="button" class="btn btn-danger small ' + (sg === 'incorrect' ? 'active' : '') + '" data-sg="incorrect" data-qid="' + q.id + '">' + ICON_X + ' 오답으로 표시</button>' +
                            '</div></div>';
                    }
                    return '<div class="card review-item">' +
                        '<div class="q-source">' + q.round + '회차 · ' + esc(q.subject) + ' · ' + q.globalNumber + '번 ' + oxHtml + guessHtml + '</div>' +
                        '<div class="q-text">' + esc(q.question) + '</div>' +
                        (q.reference ? '<div class="q-reference">' + renderRefMd(q.reference) + '</div>' : '') +
                        answerHtml +
                        '<div class="explanation-block">' + esc(q.explanation) + '</div>' +
                        selfGradeHtml +
                        '</div>';
                }).join('');

                var title = mode === 'mock' ? '모의고사 결과' : (mode === 'round' ? (round + '회 결과') : '틀린 문제 다시 풀기 결과');
                var solveTimeHtml = (mode !== 'wrong' && s.startedAt && s.submittedAt)
                    ? '<div class="solve-time-line">풀이 시간 ' + fmtDuration(s.submittedAt - s.startedAt) + '</div>' : '';

                app.innerHTML = headerHtml(title) +
                    '<main class="container">' +
                    bannerHtml +
                    '<div class="score-summary">총점 ' + fmt1(result.scorePercent) + '점 (' + result.totalCorrect + ' / ' + result.totalCount + ' 정답)</div>' +
                    solveTimeHtml +
                    round14Notice +
                    ungradedNotice +
                    subjectTableHtml +
                    '<div class="filter-tabs">' +
                    '<button type="button" class="tab-btn ' + (filter === 'all' ? 'active' : '') + '" data-filter="all">전체 보기</button>' +
                    '<button type="button" class="tab-btn ' + (filter === 'wrong' ? 'active' : '') + '" data-filter="wrong">오답만 보기</button>' +
                    '<button type="button" class="tab-btn ' + (filter === 'guess' ? 'active' : '') + '" data-filter="guess">찍은 문제만 보기</button>' +
                    '</div>' +
                    '<div class="review-list">' + (reviewHtml || '<p class="lead">해당하는 문항이 없습니다.</p>') + '</div>' +
                    '<button type="button" class="btn btn-primary full" id="retryBtn">다시 풀기</button>' +
                    '</main>';

                on('#homeBtn', 'click', function () { nav('home'); });
                on('#backBtn', 'click', function () { navBack(); });
                on('.tab-btn', 'click', function (e) {
                    state.reviewFilter = e.currentTarget.getAttribute('data-filter');
                    render();
                });
                on('[data-sg]', 'click', function (e) {
                    var qid = e.currentTarget.getAttribute('data-qid');
                    var grade = e.currentTarget.getAttribute('data-sg');
                    s.selfGrades[qid] = grade;
                    saveState(key, s);
                    render();
                });
                on('#retryBtn', 'click', function () {
                    var msg = mode === 'mock'
                        ? '새 모의고사를 시작합니다. 현재 결과는 새 시험으로 대체됩니다. 계속할까요?'
                        : (mode === 'round' ? (round + '회 문제를 다시 풉니다. 진행 기록이 초기화됩니다. 계속할까요?')
                            : '틀린 문제를 다시 풉니다. 최신 오답 목록으로 새로 시작합니다. 계속할까요?');
                    confirmModal(msg, function () {
                        if (mode === 'mock') {
                            saveState(KEY_MOCK, createMockSession(s.rounds));
                            nav('mockSolve');
                        } else if (mode === 'round') {
                            saveState(KEY_ROUND(round), createRoundSession(round));
                            nav('roundSolve', { round: round });
                        } else {
                            saveState(KEY_WRONG, createWrongSession(collectWrongDetails().map(function (d) { return d.id; })));
                            nav('wrongSolve');
                        }
                    });
                });
            }

            /* ---------- WRONG LIST ---------- */
            function renderWrongList() {
                var details = collectWrongDetails();
                var ids = details.map(function (d) { return d.id; });
                var listHtml = details.length ? details.map(function (d) {
                    var q = d.q;
                    var answerHtml;
                    if (q.type === '객관식') {
                        answerHtml = '<div class="choices review-choices">' + q.choices.map(function (val, i) {
                            var cls = 'choice-btn';
                            var tag = '';
                            var isAnswer = q.answer.indexOf(val) !== -1;
                            var isSelected = d.userAnswerText === val;
                            if (isAnswer) { cls += ' correct'; tag = '<span class="choice-tag">' + ICON_CHECK + ' 정답</span>'; }
                            else if (isSelected) { cls += ' incorrect'; tag = '<span class="choice-tag">' + ICON_X + ' 오답</span>'; }
                            return '<button type="button" class="' + cls + '" disabled>' +
                                '<span class="choice-num">' + (i + 1) + '</span>' +
                                '<span class="choice-text">' + esc(val) + '</span>' + tag +
                                '</button>';
                        }).join('') + '</div>';
                    } else {
                        answerHtml = '<div class="review-answers">' +
                            '<div>내 답: ' + esc(d.userAnswerText || '') + (d.userAnswerText ? '' : '미응답') + '</div>' +
                            '<div>정답: ' + esc(q.answer.join(' / ')) + '</div>' +
                            '</div>';
                    }
                    return '<div class="card review-item">' +
                        '<div class="q-source">' + q.round + '회차 · ' + esc(q.subject) + ' · ' + q.globalNumber + '번</div>' +
                        '<div class="q-text">' + esc(q.question) + '</div>' +
                        (q.reference ? '<div class="q-reference">' + renderRefMd(q.reference) + '</div>' : '') +
                        answerHtml +
                        '<div class="explanation-block">' + esc(q.explanation) + '</div>' +
                        '</div>';
                }).join('') : '<p class="lead">아직 틀린 문제가 없습니다. 모의고사·회차별 풀이를 채점하거나 무한 문제 풀이에서 오답을 남기면 여기에 표시됩니다.</p>';

                var actionsHtml = '';
                if (details.length > 0) {
                    var wrongS = loadState(KEY_WRONG, null);
                    if (!wrongS) {
                        actionsHtml = '<button type="button" class="btn btn-primary full" id="startWrong">틀린 문제 다시 풀어보기</button>';
                    } else if (!wrongS.submitted) {
                        var answered = wrongS.questionIds.filter(function (id) { return isAnswered(wrongS.answers[id]); }).length;
                        actionsHtml = '<p class="lead">진행 중인 다시 풀기가 있습니다. (' + answered + '/' + wrongS.questionIds.length + ' 응답)</p>' +
                            '<button type="button" class="btn btn-primary full" id="resumeWrong">이어풀기</button>' +
                            '<button type="button" class="btn btn-outline full" id="newWrong">새로 다시 풀기</button>';
                    } else {
                        actionsHtml = '<button type="button" class="btn btn-primary full" id="viewWrongResult">결과 보기</button>' +
                            '<button type="button" class="btn btn-outline full" id="newWrong">새로 다시 풀기</button>';
                    }
                }

                app.innerHTML = headerHtml('틀린 문제 모아보기') +
                    '<main class="container">' +
                    '<p class="lead">모의고사·회차별 풀이·무한 문제 풀이를 통틀어 현재 틀린 문제 ' + details.length + '개입니다.</p>' +
                    actionsHtml +
                    listHtml +
                    '</main>';

                on('#homeBtn', 'click', function () { nav('home'); });
                on('#backBtn', 'click', function () { navBack(); });
                on('#startWrong', 'click', function () {
                    saveState(KEY_WRONG, createWrongSession(ids));
                    nav('wrongSolve');
                });
                on('#resumeWrong', 'click', function () { nav('wrongSolve'); });
                on('#viewWrongResult', 'click', function () { nav('wrongResult'); });
                on('#newWrong', 'click', function () {
                    confirmModal('기존 다시 풀기 진행 데이터를 덮어씁니다. 계속할까요?', function () {
                        saveState(KEY_WRONG, createWrongSession(ids));
                        nav('wrongSolve');
                    });
                });
            }

            loadQuizData();
        })();
    </script>
</body>

</html>
